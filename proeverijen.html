<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proeverijen · WhiskyJacco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2026-10-11-2205">
<link rel="icon" type="image/png" href="assets/hert-goud-2048-vierkant.png">
<link rel="apple-touch-icon" href="assets/hert-goud-2048-vierkant.png">
<style>
/* Elke proeverij een eigen kopje (sinds 11 oktober 2026, 19:15): jaartal groot (28 px, zoals alle kopjes), dag en maand
   ernaast klein ("1 maart", 15 px grijsbruin, zoals de tellingen naast de kopjes). Geen kopjes per jaar meer, geen vlak meer,
   geen aparte datumregel meer. */
.event { scroll-margin-top: 16px; }
/* Plaats · presentator · organisatie: 15 px medium grijsbruin, zelfde opmaak als "1 maart" naast het kopje (optie D,
   sinds 11 oktober 2026, 19:25; daarvoor 14 px met een kleurlijn eronder, tussendoor 17 px) */
/* Eronder hetzelfde lijntje als tussen de whisky's (1 px --line). Precies in het midden tussen de donkere streep onder het
   kopje en dat lijntje: 10 px erboven en 10 px eronder, zoals in een whiskyregel */
.event .wie { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 500; line-height: 1.3; color: var(--muted); }
.event .wie span + span::before { content: "·"; margin: 0 7px; }
/* Via een label Proeverij aangekomen: de pagina springt naar die proeverij, zonder vlak (sinds 11 oktober 2026, 19:20) */
.event ol.wl > li:last-child { border-bottom: 0; }

/* Whiskyregels: zelfde balkje en zelfde ruimte links als op Whisky's en Collectie (style.css). De line-up-cijfers zijn weg
   (11 oktober 2026); de volgorde van de avond blijft de volgorde van de lijst.
   Een whisky die (nog) niet op Whisky's staat heeft geen gegevensregel: daar is het balkje alleen zo hoog als de naam. */
.event ol.wl > li.los::after { grid-row: 1; }
</style>
</head>
<body>
<div class="topnav" id="topnav">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">WHISKYJACCO</a>
      <nav class="mainnav" aria-label="Hoofdmenu">
        <a href="index.html">Home</a>
        <a href="whiskys.html">Whisky's</a>
        <a href="top.html">Top</a>
        <a href="collectie.html">Collectie</a>
        <a href="proeverijen.html" aria-current="page">Proeverijen</a>
      </nav>
    </div>
  </div>
</div>
<header class="site-head">
  <div class="wrap">
    <div>
      <h1 class="page-title">Proeverijen</h1>
      <p class="page-sub" id="sub"></p>
    </div>
  </div>
</header>
<div class="schaalband" aria-hidden="true"></div>
<main class="wrap" id="lijst"></main>

<footer class="site-foot"><div class="wrap"><span class="voet-merk">WhiskyJacco © Jacco van der Vliet</span></div></footer>
<script src="assets/data.js"></script>
<script src="assets/bron.js"></script>
<script src="assets/wj.js"></script>
<script>
wjKlaar.then(function (WJ) {
  const { proeverijen, esc, datumLang, regel } = WJ;
  const totaal = proeverijen.reduce((s, p) => s + p.items.length, 0);
  document.getElementById("sub").textContent = `${proeverijen.length} ${proeverijen.length === 1 ? "proeverij" : "proeverijen"} · ${totaal} ${totaal === 1 ? "whisky" : "whisky's"}`;

  // Elke proeverij een eigen kopje: jaartal groot, "1 maart" ernaast (zelfde opmaak als de groepskoppen op de andere pagina's)
  const dagMaand = iso => datumLang(iso).replace(/\s\d{4}$/, "");   // "1 maart 2026" → "1 maart"
  document.getElementById("lijst").innerHTML = proeverijen.map(p => { return `
        <section class="group event" id="${p.id}" aria-labelledby="t-${p.id}">
          <h2 id="t-${p.id}"><span class="l">${p.datum.slice(0, 4)}</span><span class="n">${dagMaand(p.datum)}</span></h2>
          <p class="wie">${[p.plaats, p.presentator, p.organisatie].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</p>
          <ol class="wl">${p.items.map(x => {
            const w = x.whisky;
            return w ? regel(w, { zonder: ["Proeverij"] })
              : `<li class="los"><span class="name">${esc(WJ.kaal(x.naam, x.vintage, x.sr))}</span>${WJ.losseTags(x).length ? `<span class="tags">${WJ.losseTags(x).map(t => WJ.tagHtml(x, t)).join("")}</span>` : ""}</li>`;
          }).join("")}</ol>
        </section>`; }).join("");

  // Bij een link naar een bepaalde proeverij (proeverijen.html#p-2026-03-01) daarheen springen (de lijst wordt pas na het
  // laden gemaakt, dus de browser kan dat niet zelf)
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({ block: "start" }); }
});
</script>

</body>
</html>
