<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proeverijen · WhiskyJacco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2026-10-16-1530">
<link rel="icon" type="image/png" href="assets/hert-goud-2048-vierkant.png">
<link rel="apple-touch-icon" href="assets/hert-goud-2048-vierkant.png">
<style>
/* Elke proeverij een eigen kopje (sinds 12 oktober 2026): de hele datum groot ("1 MAART 2026", 28 px hoofdletters, zoals
   alle kopjes), het aantal whisky's van die avond ernaast ("7 whisky's", 15 px grijsbruin, zoals de tellingen naast de
   kopjes op Whisky's en Collectie). (11 oktober 19:15 tot 12 oktober: jaartal groot met "1 maart" ernaast.)
   Geen kopjes per jaar, geen vlak, geen aparte datumregel. */
.event { scroll-margin-top: 16px; }
main.wrap { padding-bottom: 30px; }
/* Presentator · organisatie · plaats op één regel, in dezelfde opmaak als de gegevensregel onder een whisky:
   14 px normaal grijsbruin, 5 px rond de stip (variant B, sinds 12 oktober 2026, 16:00; gekozen uit acht varianten A–H).
   Een te lange regel loopt gewoon door. Wat leeg is valt weg.
   Eerder die dag: drie regels onder elkaar, 16 px vet; daarvoor "plaats · presentator · organisatie" 15 px medium.
   Eronder hetzelfde lijntje als tussen de whisky's (1 px --line), 10 px erboven en eronder, zoals in een whiskyregel. */
.event .wie { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 400; line-height: 1.3; color: var(--muted); }
.event .wie span + span::before { content: "·"; margin: 0 5px; }
/* Via een label Proeverij aangekomen: de pagina springt naar die proeverij, zonder vlak (sinds 11 oktober 2026, 19:20) */
.event ol.wl > li:last-child { border-bottom: 0; }
.event:last-child ol.wl > li:last-child { border-bottom: 1px solid var(--line); }   /* sluitlijn onder de laatste regel, zoals op Whisky's en Collectie */

/* Whiskyregels: zelfde balkje en zelfde ruimte links als op Whisky's en Collectie (style.css). De line-up-cijfers zijn weg
   (11 oktober 2026); de volgorde van de avond blijft de volgorde van de lijst.
   Een whisky die (nog) niet op Whisky's staat heeft geen gegevensregel: daar is het balkje alleen zo hoog als de naam. */
.event ol.wl > li.los::after { grid-row: 1; }
</style>
</head>
<body>
<div class="topnav" id="topnav">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">WHISKYJACCO</a>
      <nav class="mainnav" aria-label="Hoofdmenu">
        <a href="index.html" data-t="Home">Home</a>
        <a href="whiskys.html" data-t="Whisky's">Whisky's</a>
        <a href="top.html" data-t="Top">Top</a>
        <a href="collectie.html" data-t="Collectie">Collectie</a>
        <a href="proeverijen.html" aria-current="page" data-t="Proeverijen">Proeverijen</a>
      </nav>
    </div>
  </div>
</div>
<!-- Geen zichtbare titel en ondertitel meer (sinds 12 oktober 2026): alleen voor schermlezers -->
<h1 class="sr">Proeverijen</h1>
<p class="sr" id="sub"></p>
<main class="wrap" id="lijst"></main>

<footer class="site-foot"><div class="wrap"><span class="voet-merk">WhiskyJacco © Jacco van der Vliet</span></div></footer>
<script src="assets/data.js?v=2026-10-16-1530"></script>
<script src="assets/bron.js?v=2026-10-16-1530"></script>
<script src="assets/wj.js?v=2026-10-16-1530"></script>
<script>
wjKlaar.then(function (WJ) {
  const { proeverijen, esc, datumLang, regel } = WJ;
  const totaal = proeverijen.reduce((s, p) => s + p.items.length, 0);
  document.getElementById("sub").textContent = `${proeverijen.length} ${proeverijen.length === 1 ? "proeverij" : "proeverijen"} · ${totaal} ${totaal === 1 ? "whisky" : "whisky's"}`;

  // Elke proeverij een eigen kopje: de hele datum groot ("1 MAART 2026"; de hoofdletters komen uit de opmaak),
  // het aantal whisky's van die avond ernaast (zelfde opmaak als de tellingen naast de groepskoppen op de andere pagina's)
  const aantalWhiskys = n => `${n} ${n === 1 ? "whisky" : "whisky's"}`;
  document.getElementById("lijst").innerHTML = proeverijen.map(p => { return `
        <section class="group event" id="${p.id}" aria-labelledby="t-${p.id}">
          <h2 id="t-${p.id}"><span class="l">${datumLang(p.datum)}</span><span class="n">${aantalWhiskys(p.items.length)}</span></h2>
          <p class="wie">${[p.presentator, p.organisatie, p.plaats].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</p>
          <ol class="wl">${p.items.map(x => {
            const w = x.whisky;
            return w ? regel(w, { zonder: ["Proeverij"] })
              : `<li class="los"><span class="name">${esc(WJ.kaal(x.naam, x.vintage, x.sr))}</span>${WJ.losseTags(x).length ? `<span class="tags">${WJ.losseTags(x).map(t => WJ.tagHtml(x, t)).join("")}</span>` : ""}</li>`;
          }).join("")}</ol>
        </section>`; }).join("");

  // Bij een link naar een bepaalde proeverij (proeverijen.html#p-2026-03-01) daarheen springen (de lijst wordt pas na het
  // laden gemaakt, dus de browser kan dat niet zelf)
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) WJ.springNaar(() => document.getElementById(location.hash.slice(1))); }
});
</script>

</body>
</html>
