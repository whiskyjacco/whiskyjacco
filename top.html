<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top · WhiskyJacco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" href="assets/hert-goud-2048-vierkant.png">
<link rel="apple-touch-icon" href="assets/hert-goud-2048-vierkant.png">
<style>
/* Top als fles-etiketten (gekozen 10 oktober 2026, variant C uit het testvoorbeeld) */
/* Ruimte rondom de etiketten: boven, opzij en onder 20 px (main.wrap heeft al 4 px boven en 20 px opzij) */
main.wrap { padding-bottom: 20px; }
/* Altijd één kolom: de etiketten staan onder elkaar, ook op een breed scherm */
.etiketten { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
/* Kleurverloop zoals de kop van de site: linksboven licht, rechtsonder warm amber (verloop 3, gekozen 10 oktober 2026) */
.etiket { background: linear-gradient(135deg, #FFF3DC 0%, #FBE2B4 55%, #F4CC8A 100%); border-radius: 6px; padding: 6px; box-shadow: 0 1px 0 rgba(42,26,14,.06), 0 8px 20px rgba(120,60,10,.08); }
.etiket .rand { border: 1.5px solid var(--bar); outline: 1px solid var(--bar); outline-offset: -6px; border-radius: 3px; padding: 20px 16px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
/* Bovenregel: soort, hert, land. Soort en land even breed, zodat het hert precies in het midden staat */
.etiket .boven { align-self: stretch; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--bar); }
.etiket .boven > span:first-child { text-align: right; }
.etiket .boven > span:last-child { text-align: left; }
.etiket .hert { width: 28px; height: 28px; background: url(assets/hert-goud-2048-vierkant.png) center / contain no-repeat; }
/* Naam in regels: merk 24 px, leeftijd 20 px, naam 16 px (een te lange regel loopt door op de volgende) */
.etiket .nm { font-family: var(--display); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); text-wrap: balance; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.etiket .nm > span { display: block; line-height: 1.1; }
.etiket .nm .merk { font-size: 24px; }
.etiket .nm .lft { font-size: 20px; }
.etiket .nm .rest { font-size: 16px; }
.etiket .lijn { width: 160px; height: 2px; background: var(--schaal); border-radius: 1px; }
.etiket .klein { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
</style>

</head>
<body>
<div class="topnav" id="topnav">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">WHISKYJACCO</a>
      <nav class="mainnav" aria-label="Hoofdmenu">
        <a href="index.html">Home</a>

        <a href="top.html" aria-current="page">Top</a>
        <a href="collectie.html">Collectie</a>
        <a href="proeverijen.html">Proeverijen</a>
      </nav>
    </div>
  </div>
</div>
<header class="site-head">
  <div class="wrap">
    <div>
      <h1 class="page-title">Top</h1>
      <p class="page-sub" id="sub"></p>
    </div>
  </div>
</header>
<div class="schaalband" aria-hidden="true"></div>
<main class="wrap">
  <ul class="etiketten" id="lijst"></ul>
</main>

<footer class="site-foot"><div class="wrap"><span class="voet-merk">WhiskyJacco © Jacco van der Vliet</span></div></footer>
<script src="assets/data.js"></script>
<script src="assets/bron.js"></script>
<script src="assets/wj.js"></script>
<script>
wjKlaar.then(function (WJ) {
  const { whiskys, esc } = WJ;
  // Op volgorde geproefd, de laatst geproefde topper bovenaan
  const top = whiskys.filter(w => w.tags.includes("Top")).sort((a, b) => b.nr - a.nr);
  document.getElementById("sub").textContent = `${top.length} ${top.length === 1 ? "winnaar" : "winnaars"} · ${whiskys.length} ${whiskys.length === 1 ? "keuze" : "keuzes"}`; // keuzes = alle geproefde whisky's
  const MEERWOORD = ["Johnnie Walker", "Jack Daniel's", "Glen Scotia", "Glen Deveron", "Glen Garioch", "Glen Keith", "Glen Talloch", "Glen Turner",
    "Big Peat", "Isle Of Skye", "Rock Island", "Four Roses", "Buffalo Trace", "Maker's Mark", "Woodford Reserve", "Jim Beam", "Chivas Regal",
    "Monkey Shoulder", "Old Pulteney", "Ben Nevis", "Ben Bracken", "Canadian Club", "Famous Grouse", "Lone Hawthorn", "Bad Na H-Achlaise",
    "Cù Bòcan", "Milk & Honey", "Great Glen", "Mac Spey", "Black Ram", "Three Ships", "Highland Park", "Port Askaig", "Elements Of Islay",
    "Loch Lomond", "Pig's Nose", "Timorous Beastie", "Canny Beat", "Old St. Andrews", "Three Scottish Brothers", "Meikle Tòir", "Frysk Hynder",
    "Gouden Carolus", "Blair Athol", "Kingston Reserve", "Amrita Mumbay", "Glasgow 1770", "Maison Lacroix", "Singleton Of Dufftown", "Temple Bar", "Eagle Rare"];
  function etiketNaam(w) {
    const naam = w.toon, the = /^the\s+/i.test(naam), z = naam.replace(/^the\s+/i, "");
    const m = MEERWOORD.find(x => z.toLowerCase() === x.toLowerCase() || z.toLowerCase().startsWith(x.toLowerCase() + " ")) || z.split(" ")[0];
    let rest = z.slice(m.length).trim();
    const merk = (the ? naam.slice(0, naam.length - z.length) : "") + z.slice(0, m.length);
    const lft = rest.match(/^(\d+\s+Years?)\b\s*/i);
    const regels = [["merk", merk]];
    if (lft) { regels.push(["lft", lft[1]]); rest = rest.slice(lft[0].length).trim(); }
    if (rest) regels.push(["rest", rest]);
    return regels.map(([k, r]) => `<span class="${k}">${esc(r)}</span>`).join("");
  }
  const getal = v => String(Math.round(v * 10) / 10).replace(".", ",");
  // Geen labels op het etiket (10 oktober 2026): vintage, oplage en Diageo-jaartal staan in de regel onder de naam
  document.getElementById("lijst").innerHTML = top.map(w => `<li class="etiket"><div class="rand">
      <span class="boven"><span>${esc(w.soort)}</span><span class="hert" aria-hidden="true"></span><span>${esc(w.land)}</span></span>
      <span class="nm">${etiketNaam(w)}</span>
      <span class="lijn" aria-hidden="true"></span>
      <span class="klein">${getal(w.abv)}% vol${w.vintage ? ` · gedistilleerd ${w.vintage}` : ""}${w.oplage ? ` · ${WJ.duizend(w.oplage)} flessen` : ""}${w.sr ? ` · Diageo ${w.sr}` : ""}</span>
      <span class="klein">Geproefd als #${w.nr}</span>
    </div></li>`).join("");
});
</script>

</body>
</html>
