<script>
wjKlaar.then(function (WJ) {
  const { whiskys, vergelijk, regel } = WJ;
  const top = whiskys.filter(w => w.tags.includes("Top")).sort((a, b) => vergelijk(a.naam, b.naam));
  document.getElementById("sub").textContent = `${top.length} ${top.length === 1 ? "winnaar" : "winnaars"} · ${whiskys.length} ${whiskys.length === 1 ? "keuze" : "keuzes"}`; // keuzes = alle geproefde whisky's
  document.getElementById("lijst").innerHTML = top.map(w => regel(w, { zonder: ["Top"] })).join("");
});
</script>
