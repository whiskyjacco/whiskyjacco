<style>
/* Detailpagina van één whisky (sinds 24 oktober 2026; gekozen in WJ testvoorbeeld, opzet "Kort"). Welke whisky: het nummer
   achter # (whisky.html#237). Alle letters, maten en kleuren komen al elders op de site voor (gemeten op 360 px). */
main.wrap { padding-top: 0; padding-bottom: 29px; }   /* 29 px tot de voet, zoals overal */
.blok { padding-top: 20px; }
.blok.bovenaan { padding-top: 24px; }                 /* 29 px van de kleurschaal tot de letters van de kop, zoals Collectie en Proeverijen (kop 24 px) */
/* Kopjes zoals op Home */
.blok > h2 { margin: 0 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.blok > h2 .k { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.tekst { margin: 0; font-size: 15px; line-height: 1.5; max-width: 62ch; }
/* Naam als link in de lopende tekst: zelfde letter als de tekst, met een lichte streep eronder zodat je ziet dat je kunt klikken; amber bij aanwijzen */
.tekst a.naam { text-decoration: underline; text-decoration-color: var(--btn-off); text-decoration-thickness: 1px; text-underline-offset: 3px; }
@media (hover: hover) { .tekst a.naam:hover { text-decoration-color: var(--amber); } }
.klein { font-size: 13px; color: var(--muted); }
main b { font-weight: 700; }                          /* vette getallen 15 px 700, zoals de cijfers op Home */

/* Begin van de pagina (sinds 25 oktober 2026; daarvoor het label zoals op Top): de naam als kopje in drie regels, zoals de
   regels op het label maar links en in de maat van de kopjes: Merk 28 px, Merk 2 20 px, Merk 3 16 px (Barlow Condensed vet,
   hoofdletters), donkere streep eronder; pijlen naar vorige en volgende rechts, koperbruin, aantikvlak 44 px */
.blok > h2.kop { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 8px; }
.kop .regels { display: flex; flex-direction: column; gap: 2px; font-family: var(--display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.kop .regels > span { display: block; line-height: 1.05; }
.kop .merk { font-size: 28px; }
/* Kleur (sinds 25 oktober 2026, variant D uit WJ testvoorbeeld, pagina Kleur): Merk donkerbruin, Merk 2 amber (zoals GEPROEFD
   op Home), Merk 3 grijsbruin */
.kop .lft { font-size: 20px; color: var(--amber); }
.kop .rest { font-size: 16px; color: var(--muted); }
.kop .pijlen { display: flex; flex: none; margin: -10px -12px 0 0; }
.kop .pijl { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--bar); transition: color .15s; }
.kop .pijl.leeg { visibility: hidden; }
.kop .pijl svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .kop a.pijl:hover { color: var(--ink); } }

/* Over deze whisky: naam en waarde, met een lijntje zoals tussen de whisky's */
.feiten { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 16px; font-size: 15px; }
.feiten dt { color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--line); }
.feiten dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.feiten dd .klein { font-weight: 400; }
.feiten a { color: var(--amber); font-weight: 500; }
.feiten dd .labels { display: flex; flex-wrap: wrap; gap: 4px; }
.feiten dd .tag, .feiten dd .tag:hover { font-weight: 600; color: var(--tag-fg); }

/* In het kort: hoogtepunten met het staande kleurstreepje (4 px + 8 px), zoals de whiskyregels */
.hoogte { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.hoogte li { position: relative; padding-left: 12px; font-size: 15px; line-height: 1.5; max-width: 62ch; }
.hoogte li::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 4px; border-radius: 2px; background: var(--schaal-v); }

/* Kolommen zoals ABV en Leeftijd op Home (170 px, 2 px ertussen, as om de 5); deze whisky donker */
.blok > .tekst + .grafiek, .blok > .tekst + .nieuw { margin-top: 12px; }
.kolommen { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 170px; border-bottom: 1px solid var(--muted); }
.kolommen .k { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
.kolommen .k span { display: block; width: 100%; border-radius: 4px 4px 0 0; transition: filter .15s; }
@media (hover: hover) { .kolommen a.k:hover span { filter: brightness(1.1); } }
.kolommen a.k:focus-visible span { filter: brightness(1.1); }
.grafiek > .as { display: flex; gap: 2px; margin-top: 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grafiek > .as span { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; overflow: visible; }
/* Vatsterkte bij 50%, zoals op Home */
.zone { position: absolute; top: 0; height: 170px; border-left: 2px dashed var(--muted); pointer-events: none; }
.zone em { position: absolute; top: -2px; left: 6px; font-style: normal; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; background: var(--bg); padding: 0 3px; }
.tussen { margin: 16px 0 8px; }

/* Gemiddeld per groep: balken; naam- en waardekolom op maat gemeten (script), bij Sterkte en Leeftijd gelijk */
.vergelijk { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.vergelijk .v-rij { display: grid; grid-template-columns: var(--naam, minmax(0, 42%)) minmax(0, 1fr) var(--waarde, 48px); gap: 8px; align-items: center; font-size: 15px; color: inherit; text-decoration: none; }
.vergelijk.meten .v-rij { grid-template-columns: max-content minmax(0, 1fr) max-content; }
/* Elke balk behalve Deze whisky linkt naar Whisky's (sinds 24 oktober 2026, 23:30): bij aanwijzen naam amber en balk 10% lichter, zoals op Home */
@media (hover: hover) { .vergelijk a.v-rij:hover .v-naam { color: var(--amber); } .vergelijk a.v-rij:hover .v-baan span { filter: brightness(1.1); } }
.vergelijk a.v-rij:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px; }
/* Een lange naam loopt door op een tweede regel (niet afkappen met …, zoals overal op de site) */
.vergelijk .v-naam { color: var(--muted); line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.vergelijk.meten .v-naam { white-space: nowrap; }
.vergelijk .v-naam .klein { margin-left: 4px; }
.vergelijk .v-baan { height: 14px; background: var(--track); border-radius: 0 3px 3px 0; }
.vergelijk .v-baan span { display: block; height: 100%; border-radius: 0 3px 3px 0; background: #E2A83D; }
.vergelijk li.deze .v-naam { color: var(--ink); font-weight: 700; }
.vergelijk li.deze .v-baan span { background: #4E2410; }
.vergelijk b { text-align: right; font-variant-numeric: tabular-nums; }

/* Het merk: zoals Recent op Home (zelfde regel, schuifbaar, streepje) */
.nieuw { list-style: none; margin: 0; padding: 0; }
.nieuw li { display: grid; grid-template-columns: minmax(0, 1fr); align-items: baseline; padding: 0 0 0 12px; border-bottom: 1px solid var(--line); position: relative; }
.nieuw li::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 2px; background: var(--schaal-v); }
.nieuw .nm {
  font-size: 16px; font-weight: 600; white-space: nowrap; min-width: 0; padding-block: 8px; line-height: 1.25;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  --l: 0px; --r: 0px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--l), #000 calc(100% - var(--r)), transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 var(--l), #000 calc(100% - var(--r)), transparent 100%);
}
.nieuw .nm::-webkit-scrollbar { display: none; }
.nieuw .nm.meer-r { --r: 28px; }
.nieuw .nm.meer-l { --l: 20px; }
.nieuw .nm small { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.nieuw .nm small span + span::before { content: " · "; }
.nieuw .nm small .stip { font-style: normal; font-weight: 400; color: var(--muted); }
.nieuw .nm small .wb { color: var(--amber); font-weight: 500; text-decoration: none; }
.nieuw .nm small .wb span { text-decoration: underline; text-underline-offset: 2px; }
.nieuw .nm small .wb:hover { color: var(--ink); }
.nieuw .nm .tag { display: inline-block; margin: -4px 0 -4px 8px; vertical-align: middle; line-height: 1.4; }
.nieuw .nm .tag + .tag { margin-left: 4px; }

/* Uitlegje bij aanwijzen, zoals op Home */
#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--on-fg); font-size: 14px; padding: 6px 10px; border-radius: 10px; opacity: 0; transition: opacity .1s; white-space: nowrap; }
#tip.toon { opacity: 1; }
</style>
