   Fles/sample/mini dikgedrukt (600), in hetzelfde grijsbruin als de rest van de regel. */

<!-- Geen zichtbare titel en ondertitel meer (sinds 12 oktober 2026): alleen voor schermlezers -->
<h1 class="sr">Collectie</h1>
<p class="sr" id="sub"></p>
<main class="wrap" id="lijst"></main>

<footer class="site-foot"><div class="wrap"><span class="voet-merk">WhiskyJacco © Jacco van der Vliet</span></div></footer>
<script src="assets/data.js?v=2026-10-18-0820"></script>
<script src="assets/bron.js?v=2026-10-18-0820"></script>
<script src="assets/wj.js?v=2026-10-18-0820"></script>
<script>
wjKlaar.then(function (WJ) {
  const { collectie, esc, abvText, vergelijk, regel } = WJ;
  const STATUSSEN = [
    { status: "Geopend", kop: "Geopend" },
    { status: "Ongeopend", kop: "Ongeopend" },
    // Kopje "Ongeproefd" (sinds 12 oktober 2026; was "Nog niet geproefd"). De status in de sheet blijft "Ongeopend, nog niet geproefd".
    { status: "Ongeopend, nog niet geproefd", kop: "Ongeproefd" }
  ];
  // Drie soorten (kolom Type in de sheet): fles, sample en mini (sinds 12 oktober 2026), elk met enkelvoud en meervoud
  const VORMEN = [["Fles", "fles", "flessen"], ["Sample", "sample", "samples"], ["Mini", "mini", "mini's"]];
  const woord = (type, n) => { const v = VORMEN.find(x => x[0] === type) || VORMEN[0]; return n === 1 ? v[1] : v[2]; };
  // Tellen per type, in de volgorde fles · sample · mini; een soort die er niet is valt weg: "5 flessen · 3 samples · 1 mini"
  const tel = (lijst, type) => lijst.filter(c => c.type === type).reduce((s, c) => s + c.aantal, 0);
  const telTekst = lijst => VORMEN.map(([type]) => { const n = tel(lijst, type); return n ? `${n} ${woord(type, n)}` : ""; })
    .filter(Boolean).join(" · ");
  document.getElementById("sub").textContent = telTekst(collectie);

  // Bij elke whisky: fles, sample of mini, zonder hoofdletter (bij meer dan één: "2 flessen", "2 samples", "2 mini's"),
  // vooraan in de gegevensregel in plaats van het #nummer
  const aantalNoot = c => `<span class="vorm">${c.aantal > 1 ? c.aantal + " " : ""}${woord(c.type, c.aantal)}</span>`;
  // Whiskyregel zoals elders (wj.js), maar met fles/sample op de plek van "#nummer"
  const collectieRegel = c => regel(c.whisky, { zonder: ["Collectie"] }).replace(`<span>#${c.whisky.nr}</span>`, aantalNoot(c));

  document.getElementById("lijst").innerHTML = STATUSSEN.map(({ status, kop }) => {
    const items = collectie.filter(c => c.status === status).sort((a, b) => vergelijk(a.naam, b.naam));
    if (!items.length) return "";
    return `<section class="group" id="${status === "Geopend" ? "geopend" : status === "Ongeopend" ? "ongeopend" : "nieuw"}">
      <h2><span class="l">${kop}</span><span class="n">${telTekst(items)}</span></h2>
      <ul class="wl">${items.map(c => c.whisky
        ? collectieRegel(c)
        : `<li><span class="name">${esc(WJ.kaal(c.naam, c.vintage, c.sr))}</span>
             <span class="meta">${[aantalNoot(c), c.soort ? `<span>${esc(c.soort)}</span>` : "", c.land ? WJ.landTekst(c.land) : "", c.abv != null ? `<span>${abvText(c.abv)}</span>` : "", c.wb ? `<i class="stip" aria-hidden="true">·</i><a class="wb" href="${c.wb}" target="_blank" rel="noopener" aria-label="Bekijk ${esc(c.naam)} op Whiskybase">WB</a>` : ""].join("")}</span>
             ${WJ.losseTags(c).length ? `<span class="tags">${WJ.losseTags(c).map(t => WJ.tagHtml(c, t)).join("")}</span>` : ""}</li>`).join("")}
      </ul>
    </section>`;
  }).join("");
});
</script>

</body>
