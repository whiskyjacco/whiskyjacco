<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhiskyJacco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" href="assets/hert-goud-2048-vierkant.png">
<link rel="apple-touch-icon" href="assets/hert-goud-2048-vierkant.png">
<style>
/* Groot getal, met daaronder een korte kleurschaal als scheiding naar Nieuw */
.hero { display: flex; align-items: stretch; gap: 14px; padding-block: 22px 0; }
.scheiding { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
.scheiding::before { content: ""; flex: none; width: 120px; height: 6px; border-radius: 3px; background: var(--schaal); }
.scheiding::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.hero .big { font-family: var(--display); font-weight: 700; font-size: clamp(88px, 20vw, 120px); line-height: .8; font-variant-numeric: tabular-nums; }
/* Tekst naast het getal: twee regels in hoofdletters, samen even hoog als het getal; "geproefd" in amber */
.hero p { margin: 0; padding-block: 4px 2px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--display); font-weight: 700; font-size: clamp(28px, 8vw, 46px); line-height: .9; text-transform: uppercase; letter-spacing: .04em; }
.hero p span:last-child { color: var(--amber); }


section.blok { padding-top: 24px; }
/* Kopje Nieuw: zelfde stijl als Soort, ABV en Leeftijd (hoofdletters, vet, streep eronder) */
.blok h2 { margin: 0 0 14px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.blok h2 .k { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; }
.blok > .grafiekblok:first-child { padding-top: 0; }
.blok h2 a { font-size: 15px; font-weight: 500; color: var(--amber); }


/* Grafieken: Soort, Leeftijd, ABV en Land, live berekend */

.grafiekblok { padding-top: 22px; }
.grafiekblok h3 { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.grafiekblok h3 .l { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.05; text-transform: uppercase; letter-spacing: .04em; }
.grafiekblok h3 a { font-size: 15px; font-weight: 500; color: var(--amber); }
.grafiekblok h3 { margin-bottom: 14px; }

.stapel { display: flex; height: 40px; border-radius: 8px; overflow: hidden; gap: 2px; }
.stapel a { min-width: 3px; display: block; transition: filter .15s; }
.stapel a:hover, .stapel a:focus-visible { filter: brightness(1.12); }
.legenda { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 16px; font-size: 15px; }
.legenda li { display: flex; align-items: center; gap: 8px; min-width: 0; }
/* Kleur in de legenda: rechtopstaand balkje, even breed als het streepje voor elke whisky (4 px, ronde uiteinden) */
.legenda i { width: 4px; height: 12px; border-radius: 2px; flex: none; }
.legenda b { font-variant-numeric: tabular-nums; }
.legenda .pct { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
/* Op een telefoon 8 px tussen de twee kolommen van de legenda (Soort en Land), net als bij de cijfers */
@media (max-width: 480px) { .legenda { column-gap: 8px; } }

/* Land: ring met het aantal landen in het midden, legenda ernaast */
.ring-rij { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: center; }
.ring-rij svg { width: 200px; height: 200px; display: block; }
.ring-rij .legenda { margin: 0; grid-template-columns: minmax(0, 1fr); }
@media (max-width: 480px) { .ring-rij { grid-template-columns: minmax(0, 1fr); justify-items: center; } .ring-rij .legenda { width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ring path { stroke: var(--bg); stroke-width: 2; transition: opacity .15s; }
.ring a:hover path, .ring a:focus-visible path { opacity: .85; }
.ring .midden-groot { font-family: var(--display); font-weight: 700; font-size: 44px; fill: var(--ink); }
.ring .midden-klein { font-family: var(--body); font-weight: 400; font-size: 13px; fill: var(--muted); }
/* Notitie bij Overig (Land en Soort): zelfde stijl als "126 op 40%" bij ABV, 8 px van de grafiek */
.ring .noot-getal { font-family: var(--display); font-weight: 700; font-size: 20px; fill: var(--ink); }
.ring .noot-tekst { font-family: var(--body); font-size: 13px; fill: var(--muted); }
/* Soort: alle soorten in de balk en de legenda (geen Overig). Legenda in 4 kolommen (2 rijen van 4),
   op een telefoon in 2 kolommen (4 rijen van 2). */
.legenda-soort { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 480px) { .legenda-soort { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.grafiek { position: relative; min-width: 0; }
.kolommen { display: flex; align-items: flex-end; gap: 2px; height: 170px; border-bottom: 1px solid var(--muted); }
.kolommen .k { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
.kolommen .k span { display: block; width: 100%; border-radius: 4px 4px 0 0; transition: filter .15s; }
.kolommen a.k:hover span, .kolommen a.k:focus-visible span { filter: brightness(1.12); outline: 2px solid var(--ink); outline-offset: -1px; }
.as { display: flex; gap: 2px; margin-top: 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.as span { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; overflow: visible; }
.notitie { position: absolute; top: 4px; font-size: 13px; line-height: 1.2; color: var(--muted); pointer-events: none; white-space: nowrap; }
.notitie b { font-family: var(--display); font-size: 20px; color: var(--ink); }
/* Vatsterkte: streepjeslijn en bijschrift in dezelfde kleur (grijsbruin); bijschrift als de andere: 13 px normaal */
.zone { position: absolute; top: 0; height: 170px; border-left: 2px dashed var(--muted); pointer-events: none; }
.zone em { position: absolute; top: -2px; left: 6px; font-style: normal; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; background: var(--bg); padding: 0 3px; }
.cijfers { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 12px; font-size: 15px; color: var(--muted); }
.cijfers b { color: var(--ink); font-variant-numeric: tabular-nums; }
/* Percentage achter een aantal, zoals in de legenda bij Soort ("236 71%"): 13 px grijsbruin */
.cijfers .pct { font-size: 13px; font-variant-numeric: tabular-nums; }
/* ABV en Leeftijd op een telefoon: twee gelijke kolommen. Eerste cijfer links, tweede vanaf het midden, derde eronder */
@media (max-width: 480px) {
  #abv-cijfers, #leeftijd-cijfers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 8px; }
  #abv-cijfers > span:nth-child(3), #leeftijd-cijfers > span:nth-child(3) { grid-column: 1 / -1; }
}


#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--on-fg); font-size: 14px; padding: 6px 10px; border-radius: 8px; opacity: 0; transition: opacity .1s; white-space: nowrap; }
#tip.toon { opacity: 1; }

/* Nieuw: compacte lijst, één regel per whisky: kleurstreepje, nummer, naam, dan soort · land · ABV en eventuele labels.
   Op een telefoon alleen nummer en naam (afgekapt met … als hij te lang is). */
.nieuw { list-style: none; margin: 0; padding: 0; }
.nieuw li { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: baseline; gap: 6px; padding: 7px 0 7px 12px; border-bottom: 1px solid var(--line); position: relative; }
.nieuw li::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px; border-radius: 2px; background: var(--amber); }
.nieuw li:nth-child(2n)::before { background: var(--bar-soft); }
.nieuw li:nth-child(3n)::before { background: var(--bar); }
.nieuw .nr { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nieuw .nm { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nieuw .nm small { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.nieuw .nm small span + span::before { content: " · "; }
.nieuw .nm .tag { margin-left: 8px; font-size: 11px; padding: 2px 8px; vertical-align: 1px; }
@media (max-width: 480px) { .nieuw .nm small, .nieuw .nm .tag { display: none; } }
</style>
</head>

<script>
wjKlaar.then(function (WJ) {
  const { whiskys, esc, slug, abvText, LABEL_VAN_TAG } = WJ;
  const $ = id => document.getElementById(id);

  // Totaal
  $("totaal").textContent = whiskys.length;
  $("totaal-tekst").innerHTML = `<span>${whiskys.length === 1 ? "whisky" : "whisky's"}</span><span>geproefd</span>`;

  // Nieuw: de vijf hoogste nummers
  $("laatst").innerHTML = [...whiskys].sort((a, b) => b.nr - a.nr).slice(0, 5).map(w => `<li>
      <span class="nr">#${w.nr}</span>
      <span class="nm">${esc(w.naam)}<small>${[w.soort, w.land, abvText(w.abv)].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</small>${w.tags.map(t => `<a class="tag" href="${esc(LABEL_VAN_TAG[t].href(w))}">${esc(t)}</a>`).join("")}</span>
    </li>`).join("");

  // ---------- Statistieken (alles live berekend uit de gegevens) ----------
  const N = whiskys.length;
  const wk = n => n + (n === 1 ? " whisky" : " whisky's");
  const pct = n => (n > 0 && n / N < .005 ? "<1" : Math.round(n / N * 100)) + "%";   // 1 van 331 → "<1%" in plaats van "0%"
  const getal = v => (Math.round(v * 10) / 10).toLocaleString("nl-NL"); // 43 → "43", 44.2 → "44,2"

  // Kleurschaal van de site, als kleur op een plek tussen 0 en 1
  const SCHAAL = ["#F7E7A6", "#EFCB6B", "#E2A83D", "#C9821F", "#A85E1A", "#7E3E14", "#4E2410"];
  function kleurOp(t) {
    t = Math.max(0, Math.min(1, t)) * (SCHAAL.length - 1);
    const i = Math.min(Math.floor(t), SCHAAL.length - 2), f = t - i;
    const a = SCHAAL[i].match(/\w\w/g).map(h => parseInt(h, 16)), b = SCHAAL[i + 1].match(/\w\w/g).map(h => parseInt(h, 16));
    return "rgb(" + a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",") + ")";
  }

  // Tooltip bij aanwijzen
  const tip = $("tip");
  document.addEventListener("pointermove", e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el || e.pointerType === "touch") { tip.classList.remove("toon"); return; }
    tip.textContent = el.dataset.tip;
    tip.classList.add("toon");
    const w = tip.offsetWidth;
    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX - w / 2)) + "px";
    tip.style.top = (e.clientY - 42) + "px";
  });

  // Land: ring met de vijf grootste landen en Overig, het aantal landen in het midden
  const KLEUR_LAND = { "Schotland": "#7E3E14", "Ierland": "#C9821F", "Verenigde Staten": "#EFCB6B", "Japan": "#A85E1A", "Nederland": "#4E2410", "Duitsland": "#E2A83D" };
  const RESERVE_KLEUR = ["#F7E7A6", "#A85E1A", "#E2A83D", "#4E2410", "#C9821F"];
  const perLand = new Map();
  whiskys.forEach(w => { const l = w.land || "Onbekend"; perLand.set(l, (perLand.get(l) || 0) + 1); });
  const landLijst = [...perLand].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "nl"));
  if (landLijst.length) {
    const ringDelen = landLijst.slice(0, 5).map(([naam, n], i) => ({ naam, n, kleur: KLEUR_LAND[naam] || RESERVE_KLEUR[i], href: "whiskys.html#land-" + slug(naam) }));
    const kleinLanden = landLijst.slice(5);
    if (kleinLanden.length) ringDelen.push({
      naam: "Overig", n: kleinLanden.reduce((t, [, n]) => t + n, 0), kleur: "#CDB9A0", href: "whiskys.html#land",
      detail: kleinLanden.map(([l, n]) => `${l} ${n}`).join(" · ")
    });
    const pt = (r, a) => [100 + r * Math.sin(a), 100 - r * Math.cos(a)]; // hoek 0 = boven, met de klok mee
    const R = 96, RI = 58, som = ringDelen.reduce((t, d) => t + d.n, 0);
    let hoek = 0;
    const stukken = ringDelen.map(d => {
      let a0 = hoek, a1 = hoek + d.n / som * Math.PI * 2; hoek = a1; d.a0 = a0; d.a1 = a1;
      if (a1 - a0 >= Math.PI * 2 - 1e-6) a1 = a0 + Math.PI * 2 - 1e-4; // één land: bijna-volle ring
      const g = a1 - a0 > Math.PI ? 1 : 0;
      const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(RI, a1), [x3, y3] = pt(RI, a0);
      const tip = `${d.naam}: ${wk(d.n)}${d.detail ? " (" + d.detail + ")" : ""}`;
      return `<a href="${d.href}" data-tip="${esc(tip)}" aria-label="${esc(tip)}"><path d="M${x0} ${y0} A${R} ${R} 0 ${g} 1 ${x1} ${y1} L${x2} ${y2} A${RI} ${RI} 0 ${g} 0 ${x3} ${y3} Z" fill="${d.kleur}"/></a>`;
    }).join("");
    $("ring").innerHTML = stukken +
      `<text class="midden-groot" x="100" y="94" text-anchor="middle" dominant-baseline="central">${landLijst.length}</text>` +
      `<text class="midden-klein" x="100" y="124" text-anchor="middle">${landLijst.length === 1 ? "land" : "landen"}</text>`;
    // Notitie bij Overig: 8 px boven de ring, gecentreerd boven het stuk Overig (binnen de breedte van de ring).
    // Vaste maten: regel van 24 hoog (y -28 tot -4), basislijn op -8, bovenkant van de ring op 4.
    const ov = ringDelen.find(d => d.naam === "Overig");
    if (ov) {
      const [mx] = pt(R, (ov.a0 + ov.a1) / 2);
      const nx = Math.min(144, Math.max(56, mx));
      $("ring").insertAdjacentHTML("beforeend", `<text x="${nx}" y="-8" text-anchor="middle"><tspan class="noot-getal">${kleinLanden.length}</tspan><tspan class="noot-tekst" dx="4">${kleinLanden.length === 1 ? "land" : "landen"} in Overig</tspan></text>`);
      $("ring").setAttribute("viewBox", "0 -28 200 228"); $("ring").style.height = "228px";
    }
    $("ring-legenda").innerHTML = ringDelen.map(d =>
      `<li${d.detail ? ` data-tip="${esc(d.detail)}"` : ""}><i style="background:${d.kleur}"></i><span>${esc(d.naam)} <b>${d.n}</b> <span class="pct">${pct(d.n)}</span></span></li>`).join("");
  }

  // Soort: alle soorten, elk met een vaste kleur (verandert niet als de aantallen schuiven), van veel naar weinig.
  // Een nieuwe soort zonder vaste kleur krijgt een reservekleur.
  const KLEUR_SOORT = { "Single Malt": "#C9821F", "Blend": "#7E3E14", "Blended Malt": "#EFCB6B", "Single Grain": "#4E2410",
    "Bourbon": "#E2A83D", "Tennessee": "#A85E1A", "Single Pot Still": "#F7E7A6", "Rye": "#CDB9A0" };
  const RESERVE_SOORT = ["#8C6A4A", "#D9C2A3", "#5E3A1F"];
  const telSoort = new Map();
  whiskys.forEach(w => { const s = w.soort || "Onbekend"; telSoort.set(s, (telSoort.get(s) || 0) + 1); });
  let reserve = 0;
  const delen = [...telSoort].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "nl"))
    .map(([s, n]) => ({ naam: s, n, kleur: KLEUR_SOORT[s] || RESERVE_SOORT[reserve++ % RESERVE_SOORT.length], href: "whiskys.html#soort-" + slug(s) }));
  $("stapel").innerHTML = delen.map(d =>
    `<a href="${d.href}" style="flex:${d.n} 1 0;background:${d.kleur}" data-tip="${esc(d.naam)}: ${wk(d.n)}${d.detail ? " (" + esc(d.detail) + ")" : ""}" aria-label="${esc(d.naam)}: ${wk(d.n)}"></a>`).join("");
  $("legenda").innerHTML = delen.map(d =>
    `<li${d.detail ? ` data-tip="${esc(d.detail)}"` : ""}><i style="background:${d.kleur}"></i><span>${esc(d.naam)} <b>${d.n}</b> <span class="pct">${pct(d.n)}</span></span></li>`).join("");

  // Kolommen per heel getal, van..tot. Elke kolom linkt naar de Whisky's-pagina in de juiste sortering.
  function kolommen(el, tel, van, tot, o) {
    const max = Math.max(1, ...tel.values());
    let kol = "", as = "";
    for (let x = van; x <= tot; x++) {
      const n = tel.get(x) || 0, h = n ? Math.max(2, n / max * 100) : 0;
      const balk = `<span style="height:${h}%;background:${o.kleur(x)}"></span>`;
      kol += n ? `<a class="k" href="${o.href}" data-tip="${esc(o.tip(x, n))}" aria-label="${esc(o.tip(x, n))}">${balk}</a>` : `<div class="k">${balk}</div>`;
      as += `<span>${o.label(x)}</span>`;
    }
    el.innerHTML = `<div class="kolommen" role="img" aria-label="${o.aria}">${kol}</div><div class="as" aria-hidden="true">${as}</div>`;
    const breed = tot - van + 1;
    return { links: x => (x - van) / breed * 100, midden: x => (x - van + .5) / breed * 100 };
  }
  // Notitie bij de hoogste kolom: rechts ervan, of links als de kolom rechts in de grafiek staat
  // Notitie bij de hoogste kolom: precies 8 px naast de kolom (rechts ervan, of links als de kolom rechts in de grafiek staat)
  const NOOT_RUIMTE = 8;
  function notitie(el, plek, html, index) {
    el.insertAdjacentHTML("beforeend", `<div class="notitie">${html}</div>`);
    const noot = el.lastElementChild;
    const zet = () => {
      const k = el.querySelectorAll(".kolommen .k")[index];
      if (!k) return;
      if (plek < 60) { noot.style.left = (k.offsetLeft + k.offsetWidth + NOOT_RUIMTE) + "px"; noot.style.right = ""; }
      else { noot.style.right = (el.clientWidth - k.offsetLeft + NOOT_RUIMTE) + "px"; noot.style.left = ""; }
    };
    // opnieuw zetten bij een andere schermbreedte, en zodra de grafiek (weer) een maat heeft
    zet(); window.addEventListener("resize", zet);
    if (window.ResizeObserver) new ResizeObserver(zet).observe(el);
  }
  const hoogste = tel => [...tel].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0];

  // ABV
  const abvs = whiskys.filter(w => !isNaN(w.abv) && w.abv > 0);
  const telAbv = new Map();
  abvs.forEach(w => { const g = Math.floor(w.abv + 1e-9); telAbv.set(g, (telAbv.get(g) || 0) + 1); });
  if (abvs.length) {
    const van = Math.min(...telAbv.keys()), tot = Math.max(...telAbv.keys());
    const A = kolommen($("abv"), telAbv, van, tot, {
      aria: `Aantal whisky's per heel procent ABV, van ${van} tot ${tot} procent`,
      kleur: x => kleurOp(tot > van ? (x - van) / (tot - van) : .5),
      tip: (x, n) => `${x}% tot ${x + 1}%: ${wk(n)}`,
      label: x => x % 5 === 0 ? x + "%" : "",
      href: "whiskys.html#abv"
    });
    if (van < 50 && tot >= 50) $("abv").insertAdjacentHTML("beforeend", `<div class="zone" style="left:${A.links(50)}%"><em>vatsterkte</em></div>`);
    const [pk, pn] = hoogste(telAbv);
    notitie($("abv"), A.midden(pk), `<b>${pn}</b> op ${pk}%`, pk - van);
    const sterkste = abvs.reduce((a, b) => b.abv > a.abv ? b : a);
    const vat = abvs.filter(w => w.abv >= 50).length;
    $("abv-cijfers").innerHTML = `<span>Gemiddeld: <b>${getal(abvs.reduce((s, w) => s + w.abv, 0) / abvs.length)}%</b></span>
      <span>50% en hoger: <b>${vat}</b> <span class="pct">${pct(vat)}</span></span>
      <span>Sterkste: <b>${esc(sterkste.naam)}</b></span>`;
  }

  // Leeftijd
  const metLeeftijd = whiskys.filter(w => w.leeftijd);
  const telJaar = new Map();
  metLeeftijd.forEach(w => telJaar.set(w.leeftijd, (telJaar.get(w.leeftijd) || 0) + 1));
  if (metLeeftijd.length) {
    const van = Math.min(...telJaar.keys()), tot = Math.max(...telJaar.keys());
    const oudVan = j => metLeeftijd.filter(w => w.leeftijd === j).map(w => w.naam);
    const L = kolommen($("leeftijd"), telJaar, van, tot, {
      aria: `Aantal whisky's per leeftijd, van ${van} tot ${tot} jaar`,
      kleur: x => kleurOp(tot > van ? (x - van) / (tot - van) * .85 + .12 : .5),
      tip: (x, n) => `${x} jaar: ${wk(n)}${n === 1 ? " (" + oudVan(x)[0] + ")" : ""}`,
      label: x => x % 5 === 0 ? x + " j" : "",
      href: "whiskys.html#leeftijd"
    });
    const [pk, pn] = hoogste(telJaar);
    notitie($("leeftijd"), L.midden(pk), `<b>${pn}</b> van ${pk} jaar`, pk - van);
    const oudste = metLeeftijd.reduce((a, b) => b.leeftijd > a.leeftijd ? b : a);
    $("leeftijd-cijfers").innerHTML = `<span>Met leeftijd: <b>${metLeeftijd.length}</b> <span class="pct">${pct(metLeeftijd.length)}</span></span>
      <span>Zonder leeftijd: <b>${N - metLeeftijd.length}</b> <span class="pct">${pct(N - metLeeftijd.length)}</span></span>
      <span>Oudste: <b>${esc(oudste.naam)}</b></span>`;
  }


});
</script>
</body>
</html>
